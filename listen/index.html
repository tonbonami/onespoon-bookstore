<style>
/* spec-v2 5장: 크림 배경, 폭 440px 가운데, 320px 슬라이드 오버까지 */
:root{--bg:#fcfbf4;--ink:#4a4540;--soft:#8f887d;--line:#e7e1d2;--card:#f6f2e6;--p:#d5e5f0;--pd:#5d84a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans","Nanum Gothic",system-ui,sans-serif;min-height:100vh;-webkit-text-size-adjust:100%}
.wrap{max-width:440px;margin:0 auto;padding:12px 16px 32px}
.back{background:var(--card);color:var(--soft);border-radius:8px;font-size:12px;padding:8px 12px;margin-bottom:12px;line-height:1.4}
nav{display:flex;align-items:center;justify-content:space-between;min-height:54px;gap:8px}
nav button{font:inherit;font-size:13px;color:var(--soft);background:none;border:0;padding:10px 4px;cursor:pointer;white-space:nowrap}
nav button:disabled{opacity:.3;cursor:default}
nav h1{font-size:16px;margin:0;text-align:center;font-weight:700}
.phrase{background:color-mix(in srgb,var(--p) 65%,var(--bg));border:1px solid color-mix(in srgb,var(--pd) 20%,transparent);border-radius:20px;padding:24px 20px;margin-bottom:16px}
.phrase small{display:flex;justify-content:space-between;font-size:12px;color:var(--pd);font-weight:500;margin-bottom:14px}
.fr{font-size:25px;line-height:1.35;font-weight:700;margin:0 0 8px}
.ko{font-family:"Nanum Gothic",sans-serif;font-size:15px;line-height:1.5;color:var(--soft);margin:0}
.ctrl{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 18px;box-shadow:0 4px 16px rgba(0,0,0,.03);text-align:center}
.steps{display:flex;gap:6px;margin-bottom:8px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--pd)}
.steplab{display:flex;justify-content:space-between;font-size:11px;color:var(--soft);margin-bottom:18px;font-family:"Nanum Gothic",sans-serif}
.play{width:68px;height:68px;border-radius:34px;border:0;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;cursor:pointer}
.play.on{background:var(--pd)}
.play svg{width:26px;height:26px}
.hint{font-size:12px;color:var(--soft);font-family:"Nanum Gothic",sans-serif}
.speed:empty{visibility:hidden}
.speed{display:inline-block;margin:14px 0 16px;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--p) 60%,#fff);color:var(--pd);min-height:24px}
.modes{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.modes button,.auto{font:inherit;height:32px;border-radius:16px;padding:0 12px;font-size:12px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-family:"Nanum Gothic",sans-serif}
.modes button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.auto{margin-top:12px}
.auto[aria-pressed=true]{background:var(--pd);color:#fff;border-color:var(--pd)}
.foot{font-size:12px;color:var(--soft);text-align:center;margin-top:18px;line-height:1.6;font-family:"Nanum Gothic",sans-serif}
.tmp{color:#a35f5e}
button:focus-visible{outline:2px solid var(--pd);outline-offset:2px}
@media (max-width:360px){.fr{font-size:22px}.wrap{padding:10px 12px 24px}}
</style>
</head>

// DATA = {year, voice_note, pastels:{"1":["#d5e5f0","#5d84a0"],…}, months:[…], weekdays:[…], ordinals:{}, days:[{date, fr, ko}]}

const au = $("au");
const days = DATA.days || [];

// 주소: ?d=2027-01-01(날짜형) · ?day=001(만년형) · ?m=2027-01 또는 ?m=01(이달 몰아 듣기). #뒤에 써도 된다.

const monthMode = q.get("m");
if (monthMode) {
  const ym = monthMode.length === 2 ? `${DATA.year}-${monthMode}` : monthMode;
  const k = days.findIndex(x => x.date.startsWith(ym));
  if (k >= 0) i = k;
  $("auto").hidden = false;
  $("auto").setAttribute("aria-pressed", "true");

function frDate(s) {
