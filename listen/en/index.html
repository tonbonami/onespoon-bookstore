// DATA = {year, voice_note, pastels:{"1":[연한,진한]…}, months, weekdays(월요일부터), ordinals, ext, days:[{date, fr, ko, audio}]}
const MODES = {
  full: { label: "Slow + normal", seq: [0.8, 1, 1] },   // 느리게 한 번 → 보통 두 번
  slow: { label: "Slow only", seq: [0.8, 0.8] },
  normal: { label: "Normal ×3", seq: [1, 1, 1] },
};
const RATE = { 0.8: "slow 0.8×", 1: "normal 1×" };
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';
const $ = id => document.getElementById(id);
const au = $("au");
const days = DATA.days || [];

const WK = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
let mode = "full", token = 0, playing = null, chain = false;

// 주소: ?d=2027-01-06(날짜판) · ?day=006(날짜 없는 판, 1월 1일부터 셈) · ?m=2027-01 또는 ?m=01(월간 쪽)
const q = new URLSearchParams(location.search + "&" + location.hash.slice(1));

const undated = q.has("day") || (q.get("m") || "").length === 2;

if (q.get("d")) target = days.findIndex(x => x.date === q.get("d"));
else if (q.get("day")) target = Math.min(days.length - 1, yearStart + Math.max(1, parseInt(q.get("day"), 10)) - 1);
else if (q.get("m")) {
  const m = q.get("m"), ym = m.length === 2 ? `${DATA.year}-${m}` : m;
  target = days.findIndex(x => x.date.startsWith(ym));
}
const fromMonth = q.has("m");
if (target < 0) target = yearStart;

// 주 나누기: 날짜판은 월요일 시작 달력 주, 날짜 없는 판은 1~7일, 8~14일…
const dow = s => (new Date(s + "T12:00:00").getDay() + 6) % 7;

  if (undated) { const a = yearStart + Math.floor((k - yearStart) / 7) * 7; return [Math.max(0, a), Math.min(days.length, a + 7)]; }
  const a = Math.max(0, k - dow(days[k].date));
  let b = a; while (b < days.length && (b === a || dow(days[b].date) !== 0)) b++;
  return [a, b];
}
let [w0, w1] = weekOf(target);

const md = s => `${+s.slice(5, 7)}/${+s.slice(8)}`;
function title() {
  if (undated) return `Day ${w0 - yearStart + 1} – ${w1 - yearStart}`;
  const a = days[w0].date, b = days[w1 - 1].date;
  const ma = +a.slice(5, 7), mb = +b.slice(5, 7);
  return ma === mb ? `${EN_M[ma-1]} ${+a.slice(8)}–${+b.slice(8)}` : `${EN_M[ma-1]} ${+a.slice(8)} – ${EN_M[mb-1]} ${+b.slice(8)}`;
}
function render() {
  const m = +days[Math.min(target >= w0 && target < w1 ? target : w0, days.length - 1)].date.slice(5, 7);
  const [p, pd] = DATA.pastels[m] || DATA.pastels[1];
  document.documentElement.style.setProperty("--p", p);
  document.documentElement.style.setProperty("--pd", pd);
  $("title").textContent = title();
  $("prev").disabled = w0 === 0;
  $("next").disabled = w1 >= days.length;
  $("jump").hidden = target >= w0 && target < w1;
  let html = "";
  for (let k = w0; k < w1; k++) {
    const x = days[k], when = undated
      ? `<span>Day</span><b>${k - yearStart + 1}</b>`
      : `<b>${md(x.date)}</b><span>${WK[dow(x.date)]}</span>`;
    const badge = k === target && !fromMonth ? `<span class="badge">${undated ? "Your day" : "Your date"}</span>` : "";
    html += `<div class="row${k === target && !fromMonth ? " target" : ""}" data-k="${k}">
      <div class="when">${when}</div>
      <div class="txt">${badge}<p class="fr" lang="fr">${x.fr}</p><p class="ko">${x.ko}</p>
        ${x.audio === false ? '<div class="none">Audio coming soon</div>' : '<div class="prog" hidden></div>'}</div>
      <button class="play" type="button" ${x.audio === false ? "disabled" : ""} aria-label="${undated ? "Day " + (k - yearStart + 1) : md(x.date)} play">${PLAY}</button>
    </div>`;
  }
  $("list").innerHTML = html;
  const n = days.slice(w0, w1).filter(x => x.audio !== false).length;
  $("all").disabled = n === 0;
  $("all").className = "all";
  $("all").textContent = n === 0 ? "This week's audio is coming soon" : `▶ Play all ${n} phrases this week`;
  $("modesum").textContent = `Playback · ${MODES[mode].label}`;
  $("modes").innerHTML = Object.entries(MODES).map(([k, v]) =>
    `<button type="button" data-m="${k}" aria-pressed="${k === mode}">${v.label}</button>`).join("");
  $("note").textContent = DATA.voice_note || "";
  if (target >= w0 && target < w1 && !fromMonth) {

  }
}
const row = k => document.querySelector(`.row[data-k="${k}"]`);
function mark(k, step, total, rate) {
  document.querySelectorAll(".row.on").forEach(r => {
    r.classList.remove("on"); r.querySelector(".play").innerHTML = PLAY;
    const p = r.querySelector(".prog"); if (p) p.hidden = true;
  });
  if (k == null) return;
  const r = row(k); if (!r) return;
  r.classList.add("on"); r.querySelector(".play").innerHTML = STOP;
  r.querySelector(".play").setAttribute("aria-label", "Stop");
  const p = r.querySelector(".prog");
  p.hidden = false;
  p.innerHTML = Array.from({ length: total }, (_, j) => `<i class="${j <= step ? "on" : ""}"></i>`).join("") + ` ${step + 1}/${total} · ${RATE[rate]}`;
}

  return new Promise(res => {
    au.src = src; au.playbackRate = rate; au.preservesPitch = au.webkitPreservesPitch = true;
    const done = () => { au.onended = au.onerror = null; res(); };
    au.onended = done; au.onerror = done;

  });
}
async function playDay(k, t) {
  const seq = MODES[mode].seq, x = days[k];

    if (t !== token) return false;
    mark(k, s, seq.length, seq[s]);
    await playOne(`../audio/${x.date}_fr.${DATA.ext || "mp3"}`, seq[s]);
    if (t !== token) return false;
    await wait(700);
  }
  return true;
}
function stop() { token++; au.pause(); playing = null; chain = false; mark(null); render(); }

  const t = ++token; chain = false;
  if (await playDay(k, t)) { playing = null; mark(null); }
}
async function all() {
  const t = ++token; chain = true;
  const ks = []; for (let k = w0; k < w1; k++) if (days[k].audio !== false) ks.push(k);
  for (let j = 0; j < ks.length; j++) {
    if (t !== token) return;
    $("all").className = "all on"; $("all").textContent = `■ Stop · ${j + 1}/${ks.length}`;
    const r = row(ks[j]); if (r) { const b = r.getBoundingClientRect(); if (b.top < 0 || b.bottom > innerHeight) r.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
    if (!(await playDay(ks[j], t))) return;
    await wait(900);
  }
  if (t === token) { chain = false; playing = null; mark(null); render(); }
}
$("list").onclick = e => {
  const b = e.target.closest(".play"); if (!b || b.disabled) return;
  const k = +b.closest(".row").dataset.k;
  if (playing === k && !chain) return stop();
  if (chain) { token++; au.pause(); chain = false; render(); }
  one(k);
};
$("all").onclick = () => chain ? stop() : (au.pause(), all());
$("prev").onclick = () => { stop(); [w0, w1] = weekOf(w0 - 1); render(); scrollTo(0, 0); };
$("next").onclick = () => { stop(); [w0, w1] = weekOf(w1); render(); scrollTo(0, 0); };
$("jump").onclick = () => { stop(); [w0, w1] = weekOf(target); render(); };
$("modes").onclick = e => { const b = e.target.closest("button"); if (!b) return; stop(); mode = b.dataset.m; render(); };
render();
</script>
