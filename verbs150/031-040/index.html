<style>

body{margin:0;background:#F6F7F9;color:#222;font-family:Pretendard,sans-serif}

var V=[{"id": "sortir", "no": "031", "inf": "sortir", "ko": "나가다, 외출하다", "ex": [{"fr": "Je sors avec des amis ce soir.", "kr": "오늘 저녁에 친구들이랑 나가요.", "h": ["sors"]}, {"fr": "On sort ce week-end ?", "kr": "이번 주말에 놀러 나갈까?", "h": ["sort"]}, {"fr": "Elle est sortie à midi.", "kr": "그녀는 정오에 나갔어요.", "h": ["est sortie"]}, {"fr": "Le film sort la semaine prochaine.", "kr": "그 영화는 다음 주에 개봉해요.", "h": ["sort"]}]}, {"id": "connaitre", "no": "032", "inf": "connaître", "ko": "(사람·장소를) 알다", "ex": [{"fr": "Je connais bien Paris.", "kr": "저는 파리를 잘 알아요.", "h": ["connais"]}, {"fr": "Tu connais ce restaurant ?", "kr": "이 식당 알아?", "h": ["connais"]}, {"fr": "Je l'ai connu à l'université.", "kr": "그를 대학에서 알게 됐어요.", "h": ["ai connu"]}, {"fr": "Je ne connais personne ici.", "kr": "여기 아는 사람이 아무도 없어요.", "h": ["connais"]}]}, {"id": "essayer", "no": "033", "inf": "essayer", "ko": "해 보다, 입어 보다", "ex": [{"fr": "J'essaie de comprendre.", "kr": "이해해 보려고 해요.", "h": ["essaie"]}, {"fr": "Je peux essayer cette robe ?", "kr": "이 원피스 입어 봐도 돼요?", "h": ["essayer"]}, {"fr": "J'ai essayé ce nouveau restaurant.", "kr": "이 새 식당에 가 봤어요.", "h": ["ai essayé"]}, {"fr": "Essaie encore une fois !", "kr": "한 번 더 해 봐!", "h": ["Essaie"]}]}, {"id": "mourir", "no": "034", "inf": "mourir", "ko": "죽다", "ex": [{"fr": "Je meurs de faim !", "kr": "배고파 죽겠어요!", "h": ["meurs"]}, {"fr": "Je meurs d'envie de voir ce film.", "kr": "그 영화 너무 보고 싶어요.", "h": ["meurs"]}, {"fr": "Mon chat est mort l'année dernière.", "kr": "작년에 우리 고양이가 죽었어요.", "h": ["est mort"]}, {"fr": "On meurt de chaud ici !", "kr": "여기 더워 죽겠어!", "h": ["meurt"]}]}, {"id": "comprendre", "no": "035", "inf": "comprendre", "ko": "이해하다", "ex": [{"fr": "Je comprends un peu le français.", "kr": "프랑스어를 조금 알아들어요.", "h": ["comprends"]}, {"fr": "Je ne comprends pas.", "kr": "이해가 안 돼요.", "h": ["comprends"]}, {"fr": "Tu as compris ?", "kr": "이해했어?", "h": ["as compris"]}, {"fr": "Le petit-déjeuner est compris.", "kr": "아침 식사가 포함돼 있어요.", "h": ["est compris"]}]}, {"id": "aider", "no": "036", "inf": "aider", "ko": "돕다", "ex": [{"fr": "J'aide ma mère à cuisiner.", "kr": "엄마가 요리하는 걸 도와요.", "h": ["aide"]}, {"fr": "Je peux vous aider ?", "kr": "도와드릴까요?", "h": ["aider"]}, {"fr": "Mon petit frère m'a aidé à déménager.", "kr": "남동생이 이사하는 걸 도와줬어요.", "h": ["a aidé"]}, {"fr": "Tu peux m'aider à porter ça ?", "kr": "이거 드는 것 좀 도와줄래?", "h": ["aider"]}]}, {"id": "chercher", "no": "037", "inf": "chercher", "ko": "찾다", "ex": [{"fr": "Je cherche la gare.", "kr": "역을 찾고 있어요.", "h": ["cherche"]}, {"fr": "Vous cherchez quelque chose ?", "kr": "뭐 찾으세요?", "h": ["cherchez"]}, {"fr": "J'ai cherché partout.", "kr": "여기저기 다 찾아봤어요.", "h": ["ai cherché"]}, {"fr": "Je viens te chercher à huit heures.", "kr": "8시에 데리러 갈게.", "h": ["chercher"]}]}, {"id": "ecouter", "no": "038", "inf": "écouter", "ko": "듣다", "ex": [{"fr": "J'écoute de la musique.", "kr": "음악을 들어요.", "h": ["écoute"]}, {"fr": "Écoute-moi bien.", "kr": "내 말 잘 들어.", "h": ["Écoute"]}, {"fr": "J'ai écouté ce podcast hier.", "kr": "어제 이 팟캐스트를 들었어.", "h": ["ai écouté"]}, {"fr": "Je vous écoute.", "kr": "말씀하세요.", "h": ["écoute"]}]}, {"id": "perdre", "no": "039", "inf": "perdre", "ko": "잃다, 지다", "ex": [{"fr": "Je perds toujours mes clés.", "kr": "저는 늘 열쇠를 잃어버려요.", "h": ["perds"]}, {"fr": "On perd du temps.", "kr": "시간 낭비하고 있어요.", "h": ["perd"]}, {"fr": "J'ai perdu mon téléphone.", "kr": "휴대폰을 잃어버렸어요.", "h": ["ai perdu"]}, {"fr": "Je me suis perdu dans la ville.", "kr": "시내에서 길을 잃었어요.", "h": ["suis perdu"]}]}, {"id": "finir", "no": "040", "inf": "finir", "ko": "끝내다, 끝나다", "ex": [{"fr": "Je finis de travailler à six heures.", "kr": "저는 6시에 일을 마쳐요.", "h": ["finis"]}, {"fr": "Le film finit à quelle heure ?", "kr": "영화가 몇 시에 끝나요?", "h": ["finit"]}, {"fr": "J'ai fini mes devoirs.", "kr": "숙제 다 했어요.", "h": ["ai fini"]}, {"fr": "On finit par s'habituer.", "kr": "결국엔 익숙해져요.", "h": ["finit"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
