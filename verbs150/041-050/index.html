<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F6F7F9;color:#222;font-family:Pretendard,sans-serif}

.eb{font-size:13px;color:#666;font-weight:600}

<script>
var V=[{"id": "sentir", "no": "041", "inf": "sentir", "ko": "느끼다, 냄새를 맡다, 냄새가 나다", "ex": [{"fr": "Ça sent bon !", "kr": "냄새 좋다!", "h": ["sent"]}, {"fr": "Je me sens bien aujourd'hui.", "kr": "오늘은 기분이 좋아요.", "h": ["sens"]}, {"fr": "J'ai senti une bonne odeur de café.", "kr": "좋은 커피 향을 맡았어요.", "h": ["ai senti"]}, {"fr": "Tu te sens mieux ?", "kr": "좀 나아졌어?", "h": ["sens"]}]}, {"id": "jouer", "no": "042", "inf": "jouer", "ko": "놀다, (경기·악기를) 하다", "ex": [{"fr": "Je joue au tennis le samedi.", "kr": "토요일마다 테니스를 쳐요.", "h": ["joue"]}, {"fr": "Tu joues d'un instrument ?", "kr": "악기 연주해?", "h": ["joues"]}, {"fr": "Les enfants ont joué dans le parc.", "kr": "아이들이 공원에서 놀았어요.", "h": ["ont joué"]}, {"fr": "Qui joue dans ce film ?", "kr": "이 영화에 누가 나와요?", "h": ["joue"]}]}, {"id": "travailler", "no": "043", "inf": "travailler", "ko": "일하다, 공부하다", "ex": [{"fr": "Je travaille dans une banque.", "kr": "저는 은행에서 일해요.", "h": ["travaille"]}, {"fr": "Tu travailles demain ?", "kr": "내일 일해?", "h": ["travailles"]}, {"fr": "J'ai travaillé tard hier soir.", "kr": "어젯밤 늦게까지 일했어요.", "h": ["ai travaillé"]}, {"fr": "Je travaille mon français tous les jours.", "kr": "매일 프랑스어를 공부해요.", "h": ["travaille"]}]}, {"id": "commencer", "no": "044", "inf": "commencer", "ko": "시작하다, 시작되다", "ex": [{"fr": "Le cours commence à neuf heures.", "kr": "수업은 9시에 시작해요.", "h": ["commence"]}, {"fr": "On commence ?", "kr": "시작할까요?", "h": ["commence"]}, {"fr": "J'ai commencé le français l'année dernière.", "kr": "작년에 프랑스어를 시작했어요.", "h": ["ai commencé"]}, {"fr": "Il commence à pleuvoir.", "kr": "비가 오기 시작해요.", "h": ["commence"]}]}, {"id": "rendre", "no": "045", "inf": "rendre", "ko": "돌려주다, ~하게 만들다", "ex": [{"fr": "Je te rends ton livre demain.", "kr": "내일 네 책 돌려줄게.", "h": ["rends"]}, {"fr": "Ça me rend heureuse.", "kr": "그게 나를 행복하게 해요.", "h": ["rend"]}, {"fr": "Il m'a rendu mon argent.", "kr": "그가 내 돈을 돌려줬어요.", "h": ["a rendu"]}, {"fr": "Je vais rendre visite à mes parents.", "kr": "부모님을 찾아뵐 거예요.", "h": ["rendre"]}]}, {"id": "plaire", "no": "046", "inf": "plaire", "ko": "마음에 들다", "ex": [{"fr": "Cette ville me plaît beaucoup.", "kr": "이 도시가 정말 마음에 들어요.", "h": ["plaît"]}, {"fr": "Un café, s'il vous plaît.", "kr": "커피 한 잔 주세요.", "h": ["plaît"]}, {"fr": "Le film m'a beaucoup plu.", "kr": "그 영화가 정말 좋았어요.", "h": []}, {"fr": "Ça te plairait de venir ?", "kr": "같이 오면 좋겠어? (오고 싶어?)", "h": ["plairait"]}]}, {"id": "rentrer", "no": "047", "inf": "rentrer", "ko": "(집에) 돌아오다, 들어가다", "ex": [{"fr": "Je rentre à la maison à sept heures.", "kr": "7시에 집에 돌아와요.", "h": ["rentre"]}, {"fr": "Tu rentres quand ?", "kr": "언제 들어와?", "h": ["rentres"]}, {"fr": "Elle est rentrée tard hier soir.", "kr": "그녀는 어젯밤 늦게 들어왔어요.", "h": ["est rentrée"]}, {"fr": "On va rentrer en taxi.", "kr": "택시 타고 돌아갈 거예요.", "h": ["rentrer"]}]}, {"id": "tenir", "no": "048", "inf": "tenir", "ko": "잡다, 들고 있다", "ex": [{"fr": "Je tiens la porte pour toi.", "kr": "문 잡아 줄게.", "h": ["tiens"]}, {"fr": "Tiens, c'est pour toi !", "kr": "자, 이거 너 주는 거야!", "h": ["Tiens"]}, {"fr": "Il a tenu sa promesse.", "kr": "그는 약속을 지켰어요.", "h": ["a tenu"]}, {"fr": "Je tiens à te remercier.", "kr": "꼭 고맙다고 말하고 싶어.", "h": ["tiens"]}]}, {"id": "vivre", "no": "049", "inf": "vivre", "ko": "살다, 지내다", "ex": [{"fr": "Je vis à Séoul.", "kr": "저는 서울에 살아요.", "h": ["vis"]}, {"fr": "Vous vivez seul ?", "kr": "혼자 사세요?", "h": ["vivez"]}, {"fr": "J'ai vécu deux ans en France.", "kr": "프랑스에서 2년 살았어요.", "h": ["ai vécu"]}, {"fr": "On ne vit qu'une fois !", "kr": "인생은 한 번뿐이야!", "h": ["vit"]}]}, {"id": "devenir", "no": "050", "inf": "devenir", "ko": "~이 되다", "ex": [{"fr": "La situation devient difficile.", "kr": "상황이 어려워지고 있어요.", "h": ["devient"]}, {"fr": "Qu'est-ce que tu deviens ?", "kr": "요즘 어떻게 지내?", "h": ["deviens"]}, {"fr": "Elle est devenue médecin.", "kr": "그녀는 의사가 됐어요.", "h": ["est devenue"]}, {"fr": "Je veux devenir pâtissier.", "kr": "파티시에가 되고 싶어요.", "h": ["devenir"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
