<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F6F7F9;color:#222;font-family:Pretendard,sans-serif}

.eb{font-size:13px;color:#666;font-weight:600}

<script>
var V=[{"id": "expliquer", "no": "101", "inf": "expliquer", "ko": "설명하다", "ex": [{"fr": "J'explique la règle aux étudiants.", "kr": "학생들에게 규칙을 설명해요.", "h": ["explique"]}, {"fr": "Vous pouvez m'expliquer ?", "kr": "설명해 주시겠어요?", "h": ["expliquer"]}, {"fr": "Le professeur a bien expliqué la leçon.", "kr": "선생님이 수업 내용을 잘 설명해 주셨어요.", "h": ["a", "expliqué"]}, {"fr": "Ça explique tout !", "kr": "그러면 다 설명되네!", "h": ["explique"]}]}, {"id": "recevoir", "no": "102", "inf": "recevoir", "ko": "받다, 손님을 맞다", "ex": [{"fr": "Je reçois beaucoup de mails.", "kr": "메일을 많이 받아요.", "h": ["reçois"]}, {"fr": "Tu as reçu mon message ?", "kr": "내 메시지 받았어?", "h": ["as reçu"]}, {"fr": "J'ai reçu un colis ce matin.", "kr": "오늘 아침에 소포를 받았어요.", "h": ["ai reçu"]}, {"fr": "On reçoit des amis ce soir.", "kr": "오늘 저녁에 친구들이 집에 놀러 와요.", "h": ["reçoit"]}]}, {"id": "promettre", "no": "103", "inf": "promettre", "ko": "약속하다", "ex": [{"fr": "Je te promets de venir.", "kr": "꼭 올게, 약속해.", "h": ["promets"]}, {"fr": "Promis ?", "kr": "약속해?", "h": ["Promis"]}, {"fr": "Il m'a promis de m'appeler.", "kr": "그가 전화하겠다고 약속했어요.", "h": ["a promis"]}, {"fr": "Ça promet !", "kr": "기대되는걸!", "h": ["promet"]}]}, {"id": "valoir", "no": "104", "inf": "valoir", "ko": "값어치가 있다", "ex": [{"fr": "Cette montre vaut cent euros.", "kr": "이 시계는 100유로짜리예요.", "h": ["vaut"]}, {"fr": "Ça vaut la peine.", "kr": "그럴 만한 가치가 있어요.", "h": ["vaut"]}, {"fr": "Ça a valu le coup !", "kr": "해 볼 만했어!", "h": ["a valu"]}, {"fr": "Il vaut mieux partir tôt.", "kr": "일찍 떠나는 게 좋아요.", "h": ["vaut"]}]}, {"id": "preparer", "no": "105", "inf": "préparer", "ko": "준비하다", "ex": [{"fr": "Je prépare le dîner.", "kr": "저녁을 준비해요.", "h": ["prépare"]}, {"fr": "Tu es prêt ? — Pas encore, je me prépare !", "kr": "준비됐어? — 아직, 준비하고 있어!", "h": ["prépare"]}, {"fr": "J'ai préparé une surprise.", "kr": "깜짝 선물을 준비했어요.", "h": ["ai préparé"]}, {"fr": "Je vais préparer mon examen.", "kr": "시험 준비를 할 거예요.", "h": ["préparer"]}]}, {"id": "jeter", "no": "106", "inf": "jeter", "ko": "던지다, 버리다", "ex": [{"fr": "Je jette les vieux papiers.", "kr": "오래된 서류를 버려요.", "h": ["jette"]}, {"fr": "Jette un coup d'œil !", "kr": "한번 봐!", "h": ["Jette"]}, {"fr": "J'ai jeté la bouteille à la poubelle.", "kr": "병을 쓰레기통에 버렸어요.", "h": ["ai jeté"]}, {"fr": "Ne jetez rien par terre.", "kr": "바닥에 아무것도 버리지 마세요.", "h": ["jetez"]}]}, {"id": "se-marier", "no": "107", "inf": "se marier", "ko": "결혼하다", "ex": [{"fr": "Mon amie Julie se marie en juin.", "kr": "제 친구 쥘리가 6월에 결혼해요.", "h": ["se marie"]}, {"fr": "Vous allez vous marier ?", "kr": "결혼하실 거예요?", "h": ["vous marier"]}, {"fr": "Ils se sont mariés à Paris.", "kr": "그들은 파리에서 결혼했어요.", "h": ["se sont mariés"]}, {"fr": "On va se marier l'année prochaine.", "kr": "우리는 내년에 결혼할 거예요.", "h": ["se marier"]}]}, {"id": "raconter", "no": "108", "inf": "raconter", "ko": "이야기하다, 들려주다", "ex": [{"fr": "Je raconte une histoire à ma fille.", "kr": "딸에게 이야기를 들려줘요.", "h": ["raconte"]}, {"fr": "Raconte !", "kr": "얘기해 봐!", "h": ["Raconte"]}, {"fr": "Il m'a raconté son voyage.", "kr": "그가 여행 이야기를 해 줬어요.", "h": ["a raconté"]}, {"fr": "Qu'est-ce que tu racontes ?", "kr": "무슨 소리야?", "h": ["racontes"]}]}, {"id": "accepter", "no": "109", "inf": "accepter", "ko": "받아들이다", "ex": [{"fr": "J'accepte ton invitation avec plaisir.", "kr": "초대 기꺼이 받을게.", "h": ["accepte"]}, {"fr": "Vous acceptez les cartes ?", "kr": "카드 받으세요?", "h": ["acceptez"]}, {"fr": "Elle a accepté le poste.", "kr": "그녀는 그 자리를 받아들였어요.", "h": ["a accepté"]}, {"fr": "Il faut accepter les choses comme elles sont.", "kr": "있는 그대로 받아들여야 해요.", "h": ["accepter"]}]}, {"id": "tourner", "no": "110", "inf": "tourner", "ko": "돌다, 돌리다", "ex": [{"fr": "La Terre tourne autour du Soleil.", "kr": "지구는 태양 주위를 돌아요.", "h": ["tourne"]}, {"fr": "Tournez à gauche au feu.", "kr": "신호등에서 왼쪽으로 도세요.", "h": ["Tournez"]}, {"fr": "Ils ont tourné un film à Séoul.", "kr": "그들은 서울에서 영화를 찍었어요.", "h": ["ont tourné"]}, {"fr": "Ce film tourne autour d'une famille.", "kr": "이 영화는 한 가족을 중심으로 펼쳐져요.", "h": ["tourne"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
