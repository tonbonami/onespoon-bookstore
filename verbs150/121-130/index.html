<script>
var V=[{"id": "verifier", "no": "121", "inf": "vérifier", "ko": "확인하다", "ex": [{"fr": "Je vérifie mes mails le matin.", "kr": "아침에 메일을 확인해요.", "h": ["vérifie"]}, {"fr": "Tu peux vérifier l'adresse ?", "kr": "주소 좀 확인해 줄래?", "h": ["vérifier"]}, {"fr": "J'ai vérifié deux fois.", "kr": "두 번 확인했어요.", "h": ["ai vérifié"]}, {"fr": "Je vais vérifier les horaires du train.", "kr": "기차 시간표를 확인해 볼게요.", "h": ["vérifier"]}]}, {"id": "se-reveiller", "no": "122", "inf": "se réveiller", "ko": "(잠에서) 깨다", "ex": [{"fr": "Je me réveille à six heures.", "kr": "6시에 깨요.", "h": ["me réveille"]}, {"fr": "Réveille-toi, c'est l'heure !", "kr": "일어나, 시간 됐어!", "h": ["Réveille"]}, {"fr": "Je me suis réveillé en retard.", "kr": "늦게 일어났어요.", "h": ["me suis réveillé"]}, {"fr": "Ne réveille pas le bébé.", "kr": "아기 깨우지 마.", "h": ["réveille"]}]}, {"id": "permettre", "no": "123", "inf": "permettre", "ko": "허락하다, 가능하게 하다", "ex": [{"fr": "Ce billet permet d'entrer au musée.", "kr": "이 표로 박물관에 들어갈 수 있어요.", "h": ["permet"]}, {"fr": "Vous permettez ?", "kr": "실례해도 될까요?", "h": ["permettez"]}, {"fr": "Ses parents lui ont permis de sortir.", "kr": "부모님이 그 아이에게 외출을 허락했어요.", "h": ["ont permis"]}, {"fr": "Ça va nous permettre de gagner du temps.", "kr": "그러면 시간을 아낄 수 있을 거예요.", "h": ["permettre"]}]}, {"id": "preferer", "no": "124", "inf": "préférer", "ko": "더 좋아하다", "ex": [{"fr": "Je préfère le thé au café.", "kr": "커피보다 차가 더 좋아요.", "h": ["préfère"]}, {"fr": "Tu préfères rester ici ?", "kr": "여기 있는 게 더 좋아?", "h": ["préfères"]}, {"fr": "J'ai toujours préféré la mer.", "kr": "저는 늘 바다가 더 좋았어요.", "h": ["ai", "préféré"]}, {"fr": "Je préférerais partir demain.", "kr": "내일 떠나는 게 더 좋겠어요.", "h": ["préférerais"]}]}, {"id": "reussir", "no": "125", "inf": "réussir", "ko": "성공하다, 해내다, (시험에) 붙다", "ex": [{"fr": "Elle réussit toujours ses gâteaux.", "kr": "그녀는 케이크를 늘 잘 만들어요.", "h": ["réussit"]}, {"fr": "Il ne réussit pas à ouvrir la porte.", "kr": "그는 문을 열지 못하고 있어요.", "h": ["réussit"]}, {"fr": "J'ai réussi mon examen !", "kr": "시험에 붙었어요!", "h": ["ai réussi"]}, {"fr": "Bonne chance, tu vas réussir !", "kr": "행운을 빌어, 넌 해낼 거야!", "h": ["réussir"]}]}, {"id": "se-lever", "no": "126", "inf": "se lever", "ko": "일어나다, (해가) 뜨다", "ex": [{"fr": "Je me lève à sept heures.", "kr": "저는 7시에 일어나요.", "h": ["me lève"]}, {"fr": "Lève-toi, on est en retard !", "kr": "일어나, 우리 늦었어!", "h": ["Lève"]}, {"fr": "Ce matin, je me suis levée tôt.", "kr": "오늘 아침에 일찍 일어났어요.", "h": ["me suis levée"]}, {"fr": "Le soleil se lève à l'est.", "kr": "해는 동쪽에서 떠요.", "h": ["se lève"]}]}, {"id": "obtenir", "no": "127", "inf": "obtenir", "ko": "얻다, 따다", "ex": [{"fr": "On obtient le visa en deux semaines.", "kr": "2주면 비자가 나와요.", "h": ["obtient"]}, {"fr": "Comment on obtient une carte ?", "kr": "카드는 어떻게 받아요?", "h": ["obtient"]}, {"fr": "J'ai obtenu mon diplôme en 2023.", "kr": "2023년에 졸업장을 받았어요.", "h": ["ai obtenu"]}, {"fr": "Elle va obtenir son permis.", "kr": "그녀는 운전면허를 딸 거예요.", "h": ["obtenir"]}]}, {"id": "couper", "no": "128", "inf": "couper", "ko": "자르다, 끊다", "ex": [{"fr": "Je coupe les légumes.", "kr": "채소를 썰어요.", "h": ["coupe"]}, {"fr": "Tu peux couper le son, s'il te plaît ?", "kr": "소리 좀 꺼 줄래?", "h": ["couper"]}, {"fr": "J'ai coupé le pain.", "kr": "빵을 잘랐어요.", "h": ["ai coupé"]}, {"fr": "Ça va te couper l'appétit.", "kr": "그러면 입맛이 떨어질 거야.", "h": ["couper"]}]}, {"id": "s-amuser", "no": "129", "inf": "s'amuser", "ko": "즐겁게 놀다", "ex": [{"fr": "Les enfants s'amusent dans le jardin.", "kr": "아이들이 정원에서 놀아요.", "h": ["s'amusent"]}, {"fr": "Amusez-vous bien !", "kr": "재미있게 보내세요!", "h": ["Amusez"]}, {"fr": "Je me suis bien amusé à la fête.", "kr": "파티에서 정말 재미있게 놀았어요.", "h": ["me suis", "amusé"]}, {"fr": "Tu vas t'amuser là-bas.", "kr": "거기 가면 재미있을 거야.", "h": ["t'amuser"]}]}, {"id": "refuser", "no": "130", "inf": "refuser", "ko": "거절하다", "ex": [{"fr": "Je refuse de répondre.", "kr": "대답하지 않겠어요.", "h": ["refuse"]}, {"fr": "Je ne peux pas refuser.", "kr": "거절할 수가 없어요.", "h": ["refuser"]}, {"fr": "Il a refusé mon invitation.", "kr": "그가 내 초대를 거절했어요.", "h": ["a refusé"]}, {"fr": "Ils vont refuser ce projet.", "kr": "그들은 이 계획을 거절할 거예요.", "h": ["refuser"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
