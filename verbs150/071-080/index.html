<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#F6F7F9;color:#222;font-family:Pretendard,sans-serif}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e8e8e8;padding:14px 16px 10px}
.eb{font-size:13px;color:#666;font-weight:600}
.top h1{margin:2px 0 10px;font-size:24px;color:#2F6FD6;font-weight:800}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips a{flex:none;height:34px;padding:0 14px;border:1px solid #ddd;border-radius:17px;display:flex;align-items:center;font:500 15px "Noto Sans";color:#222;text-decoration:none;background:#fff}
.chips a.on{background:#2F6FD6;border-color:#2F6FD6;color:#fff}

.card{background:#fff;border-radius:16px;padding:16px 14px 8px;margin-bottom:12px;scroll-margin-top:120px}
.vh{display:flex;align-items:baseline;gap:8px}
.vh .no{font-size:12px;color:#888;font-weight:700}
.vh h2{margin:0;font:700 26px "Noto Sans";color:#2F6FD6}
.vh .ko{font-size:15px;font-weight:700}
.ctl{display:flex;gap:8px;margin:12px 0 6px}
.all{flex:1;height:46px;border:0;border-radius:12px;background:#2F6FD6;color:#fff;font:700 16px Pretendard}
.sp{width:72px;height:46px;border:0;border-radius:12px;background:#EEF1F6;color:#222;font:700 15px Pretendard}
.row{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:12px 4px;border-top:1px solid #f0f0f0;font:inherit;color:inherit;min-height:56px}
.row .ic{flex:none;width:32px;height:32px;border-radius:16px;background:#EEF1F6;display:flex;align-items:center;justify-content:center;margin-top:1px}
.row .ic svg{width:14px;height:14px;fill:#2F6FD6}
.row .fr{font:400 17px/1.4 "Noto Sans"}
.row .kr{font-size:14px;color:#555;margin-top:2px}
.row .fr b{color:#E0533D;font-weight:500}
.row.word .fr{font-weight:700}
.row.play{background:#F3F7FE;border-radius:10px}
.row.play .ic{background:#2F6FD6}.row.play .ic svg{fill:#fff}
.note{font-size:12px;color:#888;text-align:center;margin:8px 0 0}
.pg{display:flex;justify-content:space-between;max-width:560px;margin:4px auto 0;padding:0 16px 28px}.pg a{font:600 15px Pretendard;color:#2F6FD6;text-decoration:none;padding:10px 4px}
</style></head><body>
<div class="top"><div class="eb">필수 동사 150 · 듣기</div><h1>071–080</h1><nav class="chips" id="chips"></nav></div>
<main id="main"></main>

<script>
var V=[{"id": "gagner", "no": "071", "inf": "gagner", "ko": "이기다, (돈을) 벌다", "ex": [{"fr": "Il gagne bien sa vie.", "kr": "그는 돈을 잘 벌어요.", "h": ["gagne"]}, {"fr": "Qui gagne ?", "kr": "누가 이기고 있어?", "h": ["gagne"]}, {"fr": "On a gagné le match !", "kr": "우리가 경기에서 이겼어요!", "h": ["a gagné"]}, {"fr": "Je vais gagner du temps en prenant le train.", "kr": "기차를 타면 시간을 아낄 거예요.", "h": ["gagner"]}]}, {"id": "sembler", "no": "072", "inf": "sembler", "ko": "~처럼 보이다", "ex": [{"fr": "Tu sembles fatigué.", "kr": "피곤해 보여.", "h": ["sembles"]}, {"fr": "Il me semble que c'est fermé.", "kr": "문을 닫은 것 같아요.", "h": ["semble"]}, {"fr": "Le temps m'a semblé long.", "kr": "시간이 길게 느껴졌어요.", "h": ["a semblé"]}, {"fr": "Ils semblent heureux ensemble.", "kr": "함께 있으니 행복해 보여요.", "h": ["semblent"]}]}, {"id": "rappeler", "no": "073", "inf": "rappeler", "ko": "다시 전화하다, 떠올리게 하다", "ex": [{"fr": "Je te rappelle dans cinq minutes.", "kr": "5분 뒤에 다시 전화할게.", "h": ["rappelle"]}, {"fr": "Ça me rappelle mon enfance.", "kr": "어린 시절이 생각나요.", "h": ["rappelle"]}, {"fr": "Elle ne m'a pas rappelé.", "kr": "그녀가 다시 전화하지 않았어요.", "h": ["a", "rappelé"]}, {"fr": "Tu te rappelles notre premier voyage ?", "kr": "우리 첫 여행 기억나?", "h": ["rappelles"]}]}, {"id": "retrouver", "no": "074", "inf": "retrouver", "ko": "(잃은 것을) 되찾다, 다시 만나다", "ex": [{"fr": "Je retrouve mes amis au café.", "kr": "카페에서 친구들을 만나요.", "h": ["retrouve"]}, {"fr": "On se retrouve où ?", "kr": "어디서 만날까?", "h": ["retrouve"]}, {"fr": "J'ai retrouvé mes clés !", "kr": "열쇠 찾았어요!", "h": ["ai retrouvé"]}, {"fr": "Je vais te retrouver à la gare.", "kr": "역에서 만날게.", "h": ["retrouver"]}]}, {"id": "continuer", "no": "075", "inf": "continuer", "ko": "계속하다", "ex": [{"fr": "Je continue mes études.", "kr": "공부를 계속해요.", "h": ["continue"]}, {"fr": "Continuez tout droit.", "kr": "쭉 직진하세요.", "h": ["Continuez"]}, {"fr": "Il a continué à parler.", "kr": "그는 계속 말했어요.", "h": ["a continué"]}, {"fr": "On continue demain ?", "kr": "내일 이어서 할까?", "h": ["continue"]}]}, {"id": "retourner", "no": "076", "inf": "retourner", "ko": "돌아가다, 뒤집다", "ex": [{"fr": "Je retourne en Corée en juillet.", "kr": "7월에 한국으로 돌아가요.", "h": ["retourne"]}, {"fr": "Retourne-toi !", "kr": "뒤돌아봐!", "h": ["Retourne"]}, {"fr": "Nous sommes retournés dans ce restaurant.", "kr": "우리는 그 식당에 다시 갔어요.", "h": ["sommes retournés"]}, {"fr": "Je vais retourner voir ce film.", "kr": "그 영화 다시 보러 갈 거예요.", "h": ["retourner"]}]}, {"id": "s-asseoir", "no": "077", "inf": "s'asseoir", "ko": "앉다", "ex": [{"fr": "Je m'assieds près de la fenêtre.", "kr": "창가에 앉아요.", "h": ["m'assieds"]}, {"fr": "Asseyez-vous, je vous en prie.", "kr": "앉으세요.", "h": ["Asseyez"]}, {"fr": "Elle s'est assise à côté de moi.", "kr": "그녀가 내 옆에 앉았어요.", "h": ["s'est assise"]}, {"fr": "On peut s'asseoir ici ?", "kr": "여기 앉아도 돼요?", "h": ["s'asseoir"]}]}, {"id": "boire", "no": "078", "inf": "boire", "ko": "마시다", "ex": [{"fr": "Je bois du thé le matin.", "kr": "아침에 차를 마셔요.", "h": ["bois"]}, {"fr": "Tu veux boire quelque chose ?", "kr": "뭐 마실래?", "h": ["boire"]}, {"fr": "J'ai bu trop de café.", "kr": "커피를 너무 많이 마셨어요.", "h": ["ai bu"]}, {"fr": "On va boire un verre ?", "kr": "한잔하러 갈까?", "h": ["boire"]}]}, {"id": "dormir", "no": "079", "inf": "dormir", "ko": "자다", "ex": [{"fr": "Je dors huit heures par nuit.", "kr": "저는 매일 밤 여덟 시간 자요.", "h": ["dors"]}, {"fr": "Tu dors ?", "kr": "자?", "h": ["dors"]}, {"fr": "J'ai mal dormi.", "kr": "잠을 설쳤어요.", "h": ["ai", "dormi"]}, {"fr": "Je vais dormir chez une amie.", "kr": "친구 집에서 잘 거예요.", "h": ["dormir"]}]}, {"id": "acheter", "no": "080", "inf": "acheter", "ko": "사다", "ex": [{"fr": "J'achète du pain tous les matins.", "kr": "매일 아침 빵을 사요.", "h": ["achète"]}, {"fr": "Tu achètes souvent en ligne ?", "kr": "온라인으로 자주 쇼핑해?", "h": ["achètes"]}, {"fr": "J'ai acheté un billet pour Paris.", "kr": "파리행 표를 샀어요.", "h": ["ai acheté"]}, {"fr": "Je vais acheter un cadeau pour lui.", "kr": "그에게 줄 선물을 살 거예요.", "h": ["acheter"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
