<style>

<script>
var V=[{"id": "ecrire", "no": "081", "inf": "écrire", "ko": "쓰다", "ex": [{"fr": "J'écris dans mon journal tous les soirs.", "kr": "매일 저녁 일기를 써요.", "h": ["écris"]}, {"fr": "Ça s'écrit comment ?", "kr": "그거 철자가 어떻게 돼요?", "h": ["écrit"]}, {"fr": "Je t'ai écrit un message.", "kr": "너한테 메시지 썼어.", "h": ["ai écrit"]}, {"fr": "Écris-moi quand tu arrives.", "kr": "도착하면 메시지해.", "h": ["Écris"]}]}, {"id": "quitter", "no": "082", "inf": "quitter", "ko": "떠나다, (사람과) 헤어지다", "ex": [{"fr": "Je quitte le bureau à six heures.", "kr": "6시에 퇴근해요.", "h": ["quitte"]}, {"fr": "Ne quittez pas.", "kr": "(전화) 끊지 말고 기다려 주세요.", "h": ["quittez"]}, {"fr": "Elle a quitté Paris en 2020.", "kr": "그녀는 2020년에 파리를 떠났어요.", "h": ["a quitté"]}, {"fr": "Je ne vais pas te quitter.", "kr": "널 떠나지 않을 거야.", "h": ["quitter"]}]}, {"id": "servir", "no": "083", "inf": "servir", "ko": "(음식을) 내다, 쓰이다", "ex": [{"fr": "Je sers le dîner à huit heures.", "kr": "8시에 저녁을 차려요.", "h": ["sers"]}, {"fr": "Ça sert à quoi ?", "kr": "그거 어디에 써요?", "h": ["sert"]}, {"fr": "On nous a servi un bon vin.", "kr": "좋은 와인이 나왔어요.", "h": ["a servi"]}, {"fr": "Servez-vous !", "kr": "마음껏 드세요!", "h": ["Servez"]}]}, {"id": "manquer", "no": "084", "inf": "manquer", "ko": "놓치다, 그립다, 모자라다", "ex": [{"fr": "Tu me manques.", "kr": "네가 보고 싶어.", "h": ["manques"]}, {"fr": "Il manque une chaise.", "kr": "의자가 하나 모자라요.", "h": ["manque"]}, {"fr": "J'ai manqué mon train.", "kr": "기차를 놓쳤어요.", "h": ["ai manqué"]}, {"fr": "Ma famille va me manquer.", "kr": "가족이 그리울 거예요.", "h": ["manquer"]}]}, {"id": "emmener", "no": "085", "inf": "emmener", "ko": "데려가다", "ex": [{"fr": "J'emmène mon fils à l'école.", "kr": "아들을 학교에 데려다줘요.", "h": ["emmène"]}, {"fr": "Tu m'emmènes ?", "kr": "나 데려가 줄래?", "h": ["emmènes"]}, {"fr": "Il a emmené les enfants au parc.", "kr": "그가 아이들을 공원에 데려갔어요.", "h": ["a emmené"]}, {"fr": "Je vais t'emmener à la plage.", "kr": "바닷가에 데려가 줄게.", "h": ["emmener"]}]}, {"id": "adorer", "no": "086", "inf": "adorer", "ko": "아주 좋아하다", "ex": [{"fr": "J'adore le fromage.", "kr": "치즈를 정말 좋아해요.", "h": ["adore"]}, {"fr": "Tu adores ça, hein ?", "kr": "너 이거 진짜 좋아하지?", "h": ["adores"]}, {"fr": "J'ai adoré ce film.", "kr": "그 영화 정말 좋았어요.", "h": ["ai adoré"]}, {"fr": "Les enfants vont adorer.", "kr": "아이들이 정말 좋아할 거예요.", "h": ["adorer"]}]}, {"id": "s-inquieter", "no": "087", "inf": "s'inquiéter", "ko": "걱정하다", "ex": [{"fr": "Je m'inquiète pour toi.", "kr": "네가 걱정돼.", "h": ["m'inquiète"]}, {"fr": "Ne t'inquiète pas !", "kr": "걱정하지 마!", "h": ["t'inquiète"]}, {"fr": "Ta mère s'est inquiétée.", "kr": "너희 엄마가 걱정하셨어.", "h": ["s'est inquiétée"]}, {"fr": "Il ne faut pas s'inquiéter.", "kr": "걱정할 필요 없어요.", "h": ["s'inquiéter"]}]}, {"id": "repondre", "no": "088", "inf": "répondre", "ko": "대답하다, 답장하다", "ex": [{"fr": "Je réponds à tes questions.", "kr": "네 질문에 대답해요.", "h": ["réponds"]}, {"fr": "Tu ne réponds pas au téléphone ?", "kr": "전화 안 받아?", "h": ["réponds"]}, {"fr": "Il n'a pas répondu à mon message.", "kr": "그가 내 메시지에 답하지 않았어요.", "h": ["a", "répondu"]}, {"fr": "Je vais lui répondre ce soir.", "kr": "오늘 저녁에 답장할 거예요.", "h": ["répondre"]}]}, {"id": "lire", "no": "089", "inf": "lire", "ko": "읽다", "ex": [{"fr": "Je lis le journal le matin.", "kr": "아침에 신문을 읽어요.", "h": ["lis"]}, {"fr": "Tu lis quoi en ce moment ?", "kr": "요즘 뭐 읽어?", "h": ["lis"]}, {"fr": "J'ai lu ce livre en deux jours.", "kr": "이 책을 이틀 만에 읽었어요.", "h": ["ai lu"]}, {"fr": "Je vais te lire une histoire.", "kr": "이야기 하나 읽어 줄게.", "h": ["lire"]}]}, {"id": "toucher", "no": "090", "inf": "toucher", "ko": "만지다, 감동시키다", "ex": [{"fr": "Je touche l'écran pour ouvrir l'application.", "kr": "앱을 열려고 화면을 눌러요.", "h": ["touche"]}, {"fr": "Ça me touche beaucoup.", "kr": "정말 감동이에요.", "h": ["touche"]}, {"fr": "Son message a beaucoup touché tout le monde.", "kr": "그 메시지는 모두에게 큰 감동을 줬어요.", "h": ["a", "touché"]}, {"fr": "Je touche mon salaire à la fin du mois.", "kr": "월말에 월급을 받아요.", "h": ["touche"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
