<style>

<script>
var V=[{"id": "courir", "no": "131", "inf": "courir", "ko": "달리다", "ex": [{"fr": "Je cours tous les matins.", "kr": "매일 아침 달려요.", "h": ["cours"]}, {"fr": "Ne cours pas dans les couloirs !", "kr": "복도에서 뛰지 마!", "h": ["cours"]}, {"fr": "J'ai couru pour attraper le bus.", "kr": "버스를 타려고 뛰었어요.", "h": ["ai couru"]}, {"fr": "Il va courir le marathon de Paris.", "kr": "그는 파리 마라톤을 뛸 거예요.", "h": ["courir"]}]}, {"id": "chanter", "no": "132", "inf": "chanter", "ko": "노래하다", "ex": [{"fr": "Je chante sous la douche.", "kr": "샤워하면서 노래해요.", "h": ["chante"]}, {"fr": "Tu chantes bien !", "kr": "노래 잘한다!", "h": ["chantes"]}, {"fr": "On a chanté toute la nuit.", "kr": "밤새 노래했어요.", "h": ["a chanté"]}, {"fr": "Elle va chanter à notre mariage.", "kr": "그녀가 우리 결혼식에서 노래할 거예요.", "h": ["chanter"]}]}, {"id": "pleurer", "no": "133", "inf": "pleurer", "ko": "울다", "ex": [{"fr": "Le bébé pleure la nuit.", "kr": "아기가 밤에 울어요.", "h": ["pleure"]}, {"fr": "Ne pleure pas.", "kr": "울지 마.", "h": ["pleure"]}, {"fr": "J'ai pleuré à la fin du film.", "kr": "영화 끝에서 울었어요.", "h": ["ai pleuré"]}, {"fr": "Il pleure de rire.", "kr": "그는 너무 웃겨서 눈물을 흘려요.", "h": ["pleure"]}]}, {"id": "reflechir", "no": "134", "inf": "réfléchir", "ko": "곰곰이 생각하다", "ex": [{"fr": "Je réfléchis à ta proposition.", "kr": "네 제안을 생각해 보고 있어.", "h": ["réfléchis"]}, {"fr": "Laisse-moi réfléchir.", "kr": "생각 좀 해 볼게.", "h": ["réfléchir"]}, {"fr": "J'ai bien réfléchi.", "kr": "잘 생각해 봤어요.", "h": ["ai", "réfléchi"]}, {"fr": "Réfléchis avant de parler.", "kr": "말하기 전에 생각해.", "h": ["Réfléchis"]}]}, {"id": "remercier", "no": "135", "inf": "remercier", "ko": "감사하다", "ex": [{"fr": "Je vous remercie de votre aide.", "kr": "도와주셔서 감사합니다.", "h": ["remercie"]}, {"fr": "Je ne sais pas comment te remercier.", "kr": "어떻게 고마움을 전해야 할지 모르겠어.", "h": ["remercier"]}, {"fr": "Elle a remercié le serveur.", "kr": "그녀가 웨이터에게 고맙다고 했어요.", "h": ["a remercié"]}, {"fr": "Je vais remercier tout le monde.", "kr": "모두에게 감사 인사를 할 거예요.", "h": ["remercier"]}]}, {"id": "inviter", "no": "136", "inf": "inviter", "ko": "초대하다, (밥을) 사다", "ex": [{"fr": "J'invite mes amis à dîner.", "kr": "친구들을 저녁 식사에 초대해요.", "h": ["invite"]}, {"fr": "C'est moi qui invite !", "kr": "내가 살게!", "h": ["invite"]}, {"fr": "Elle a invité toute la classe.", "kr": "그녀가 반 전체를 초대했어요.", "h": ["a invité"]}, {"fr": "Je vais t'inviter à mon anniversaire.", "kr": "내 생일에 초대할게.", "h": ["inviter"]}]}, {"id": "danser", "no": "137", "inf": "danser", "ko": "춤추다", "ex": [{"fr": "Je danse le samedi soir.", "kr": "토요일 밤마다 춤을 춰요.", "h": ["danse"]}, {"fr": "Tu veux danser ?", "kr": "춤출래?", "h": ["danser"]}, {"fr": "On a dansé jusqu'à minuit.", "kr": "자정까지 춤췄어요.", "h": ["a dansé"]}, {"fr": "Je vais apprendre à danser le tango.", "kr": "탱고를 배울 거예요.", "h": ["danser"]}]}, {"id": "rire", "no": "138", "inf": "rire", "ko": "웃다", "ex": [{"fr": "Il rit tout le temps.", "kr": "그는 늘 웃어요.", "h": ["rit"]}, {"fr": "Tu me fais rire !", "kr": "너 진짜 웃겨!", "h": ["rire"]}, {"fr": "On a beaucoup ri hier soir.", "kr": "어젯밤 정말 많이 웃었어요.", "h": ["a", "ri"]}, {"fr": "Ne ris pas de moi !", "kr": "나 비웃지 마!", "h": ["ris"]}]}, {"id": "se-reposer", "no": "139", "inf": "se reposer", "ko": "쉬다", "ex": [{"fr": "Je me repose le dimanche.", "kr": "일요일에는 쉬어요.", "h": ["me repose"]}, {"fr": "Repose-toi bien !", "kr": "푹 쉬어!", "h": ["Repose"]}, {"fr": "Je me suis reposé tout le week-end.", "kr": "주말 내내 쉬었어요.", "h": ["me suis reposé"]}, {"fr": "Tu devrais te reposer un peu.", "kr": "좀 쉬는 게 좋겠어.", "h": ["te reposer"]}]}, {"id": "naitre", "no": "140", "inf": "naître", "ko": "태어나다", "ex": [{"fr": "Beaucoup de bébés naissent chaque jour.", "kr": "매일 많은 아기가 태어나요.", "h": ["naissent"]}, {"fr": "Tu es née où ?", "kr": "어디서 태어났어?", "h": ["es née"]}, {"fr": "Je suis née à Busan.", "kr": "저는 부산에서 태어났어요.", "h": ["suis née"]}, {"fr": "Leur bébé va naître en mars.", "kr": "그들의 아기는 3월에 태어날 거예요.", "h": ["naître"]}]}];
var RATE=1, CUR=null, QUEUE=[], AUD=new Audio();
var PLAY='<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
function hl(s,h){var o=s.replace(/&/g,'&amp;').replace(/</g,'&lt;'),f=0;(h||[]).forEach(function(w){var i=o.indexOf(w,f);if(i<0)return;o=o.slice(0,i)+'<b>'+w+'</b>'+o.slice(i+w.length);f=i+w.length+7;});return o;}
function rows(v){var r='<button class="row word" data-v="'+v.id+'" data-i="0"><span class="ic">'+PLAY+'</span><span><div class="fr">'+v.inf+'</div><div class="kr">'+v.ko+'</div></span></button>';
 v.ex.forEach(function(e,i){r+='<button class="row" data-v="'+v.id+'" data-i="'+(i+1)+'"><span class="ic">'+PLAY+'</span><span><div class="fr">'+hl(e.fr,e.h)+'</div><div class="kr">'+e.kr+'</div></span></button>';});return r;}
document.getElementById('chips').innerHTML=V.map(function(v,i){return '<a href="#'+v.id+'"'+(i?'':' class="on"')+'>'+v.inf+'</a>';}).join('');
document.getElementById('main').innerHTML=V.map(function(v){return '<section class="card" id="'+v.id+'"><div class="vh"><span class="no">'+v.no+'</span><h2>'+v.inf+'</h2><span class="ko">'+v.ko+'</span></div><div class="ctl"><button class="all" data-v="'+v.id+'">▶ 전체 듣기</button><button class="sp">1.0×</button></div>'+rows(v)+'</section>';}).join('');
function textOf(id,i){var v=V.filter(function(x){return x.id===id;})[0];return i==0?v.inf:v.ex[i-1].fr;}
function mark(el){document.querySelectorAll('.row.play').forEach(function(x){x.classList.remove('play');});if(el)el.classList.add('play');}
function speak(id,i,done){var el=document.querySelector('.row[data-v="'+id+'"][data-i="'+i+'"]');mark(el);
 AUD.onended=null;AUD.onerror=null;AUD.src='../audio/'+id+'_'+i+'.mp3';AUD.playbackRate=RATE;
 AUD.onended=function(){mark(null);if(done)done();};
 AUD.onerror=function(){mark(null);document.getElementById('note').textContent='음성을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';};
 AUD.play().catch(function(){AUD.onerror();});}
function playAll(id){var i=0;(function nx(){if(i>4)return;var k=i++;speak(id,k,function(){setTimeout(nx,500);});})();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('sp')){RATE=RATE===1?0.8:1;document.querySelectorAll('.sp').forEach(function(x){x.textContent=RATE===1?'1.0×':'0.8×';});return;}
 if(b.classList.contains('all')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();playAll(b.getAttribute('data-v'));return;}
 if(b.classList.contains('row')){try{speechSynthesis.cancel();}catch(x){}AUD.pause();speak(b.getAttribute('data-v'),+b.getAttribute('data-i'));}});
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){document.querySelectorAll('.chips a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id);});}});},{rootMargin:'-130px 0px -60% 0px'});
document.querySelectorAll('.card').forEach(function(c){io.observe(c);});
if(location.hash){var _t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(_t){setTimeout(function(){_t.scrollIntoView({block:'start'});},50);}}
</script></body></html>
